[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hazard-response-classifier"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# Only for the offline L/E structure-selection harness
# (`src/hazard_classifier/experiments/`, `docs/planning/QUEUE_ITEM_2_EXECUTION_PLAN.md`).
# Not a shipping-evaluator dependency -- statsmodels' OrderedModel is the `L2`
# ordinal cumulative-link candidate's proportional-odds MLE implementation.
experiments = [
    "statsmodels",
]

[project.scripts]
hrc-train = "hazard_classifier.cli.train:main"
hrc-evaluate = "hazard_classifier.cli.evaluate:main"
hrc-predict = "hazard_classifier.cli.predict:main"
hrc-run = "hazard_classifier.cli.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hazard_classifier.preprocess" = ["data/*.txt"]
